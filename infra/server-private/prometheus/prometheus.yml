global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2-server topology: Prometheus lives on the SAME box as the app/db/redis
  # (Servidor B), so its own node-exporter and mysqld-exporter are reached
  # over the internal Docker network by service name — no IP, no firewall
  # rule needed for these two anymore (they aren't even published to the
  # host, see docker-compose.yml).
  - job_name: "node-exporter-private"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          server: "private"

  - job_name: "mysqld-exporter"
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # Internal LB's stub_status, via the sidecar exporter (network_mode:
  # service:lb) — reachable by the "lb" service name since it shares its IP.
  - job_name: "nginx-exporter-lb"
    static_configs:
      - targets: ["lb:9113"]
        labels:
          server: "private"
          role: "lb"

  # PUBLIC_SERVER_IP below is a placeholder — replace with the real private
  # IP of Servidor A before starting, see infra/DEPLOYMENT.md ("sed -i"
  # step). Only reachable because firewall-public.sh allows this server's
  # private IP through on port 9100.
  - job_name: "node-exporter-public"
    static_configs:
      - targets: ["PUBLIC_SERVER_IP:9100"]
        labels:
          server: "public"

  # Edge Nginx's stub_status, via the sidecar exporter on Servidor A. Same
  # placeholder/firewall caveat as node-exporter-public above, plus port
  # 9113 needs its own ufw + DO Cloud Firewall rule (see firewall-public.sh
  # and DEPLOYMENT.md — DO Cloud Firewalls filter VPC-private traffic too,
  # not just internet-facing, confirmed the hard way with port 9100).
  - job_name: "nginx-exporter-public"
    static_configs:
      - targets: ["PUBLIC_SERVER_IP:9113"]
        labels:
          server: "public"
          role: "edge"

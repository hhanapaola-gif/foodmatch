# Round-robin load balancer across the two Laravel app replicas.
# This is what "balanceador de carga" refers to in the architecture:
# real traffic distribution between web1 (app1) and web2 (app2).
upstream foodmatch_backend {
    server web1:80 max_fails=3 fail_timeout=10s;
    server web2:80 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64M;

    # Scraped by nginx-exporter-lb (network_mode: service:lb, so it hits this
    # over loopback) — never reachable from outside this container's netns.
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        proxy_pass http://foodmatch_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

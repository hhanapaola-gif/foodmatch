global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2-server topology: Prometheus lives on the SAME box as the app/db/redis
  # (Servidor B), so its own node-exporter and mysqld-exporter are reached
  # over the internal Docker network by service name — no IP, no firewall
  # rule needed for these two anymore (they aren't even published to the
  # host, see docker-compose.yml).
  - job_name: "node-exporter-private"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          server: "private"

  - job_name: "mysqld-exporter"
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # PUBLIC_SERVER_IP below is a placeholder — replace with the real private
  # IP of Servidor A before starting, see infra/DEPLOYMENT.md ("sed -i"
  # step). Only reachable because firewall-public.sh allows this server's
  # private IP through on port 9100.
  - job_name: "node-exporter-public"
    static_configs:
      - targets: ["PUBLIC_SERVER_IP:9100"]
        labels:
          server: "public"

  # Nginx LB and edge Nginx expose /nginx_status via stub_status; scraped
  # through a small nginx-prometheus-exporter if added later (see DEPLOYMENT.md).

name: foodmatch-private

x-app-build: &app-build
  context: ../../FoodMatch-Backend
  dockerfile: Dockerfile
  target: app

x-web-build: &web-build
  context: ../../FoodMatch-Backend
  dockerfile: Dockerfile
  target: web

services:
  # ---- Laravel replica 1 (primary: runs migrations/cache warmup on boot) ----
  app1:
    build: *app-build
    env_file: ../../FoodMatch-Backend/.env
    environment:
      CONTAINER_ROLE: primary
    volumes:
      - storage1:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web1:
    build: *web-build
    environment:
      PHP_UPSTREAM: app1:9000
    depends_on:
      - app1
    restart: unless-stopped

  # ---- Laravel replica 2 ----
  app2:
    build: *app-build
    env_file: ../../FoodMatch-Backend/.env
    environment:
      CONTAINER_ROLE: replica
    volumes:
      - storage2:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web2:
    build: *web-build
    environment:
      PHP_UPSTREAM: app2:9000
    depends_on:
      - app2
    restart: unless-stopped

  # ---- Internal load balancer: what the public server's Nginx talks to ----
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-lb/lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"   # bind only to the private network interface in production, see DEPLOYMENT.md
    depends_on:
      - web1
      - web2
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-delivery_app_db}
      MYSQL_USER: ${DB_USERNAME:-foodmatch}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?set MYSQL_EXPORTER_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init-exporter-user.sh:/docker-entrypoint-initdb.d/init-exporter-user.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # First-time initialization on a fresh volume (creating the DB +
      # running init-exporter-user.sh) can take well over 60s — without this,
      # the 10x5s retry budget runs out before mysql is ever actually ready
      # and Compose marks it "unhealthy", blocking every dependent service
      # (confirmed in pre-deploy validation). start_period doesn't count
      # failed checks against retries while mysql is still first-booting.
      start_period: 90s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # 2-server topology: Prometheus lives on THIS same box (see below), so
  # this is NOT published to the host at all — only reachable over the
  # internal Docker network by service name. Reduces attack surface vs the
  # 3-server design, where this had to be exposed for a separate monitoring box.
  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/log:/host/varlog:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile.directory=/host/varlog/node-exporter
    restart: unless-stopped

  mysqld-exporter:
    # Pinned: v0.15+ dropped DATA_SOURCE_NAME env var support in favor of a
    # --config.my-cnf file, which broke this service under :latest (confirmed
    # in pre-deploy validation). v0.14.0 is the last version reading DSN from env.
    image: prom/mysqld-exporter:v0.14.0
    # Not published to the host — same reasoning as node-exporter above.
    environment:
      DATA_SOURCE_NAME: "exporter:${MYSQL_EXPORTER_PASSWORD:?set MYSQL_EXPORTER_PASSWORD in .env}@(mysql:3306)/"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ---- Monitoring (2-server topology: colocated with the app/db) ----
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    restart: unless-stopped

  # Published to the host so the public server's Nginx can reverse proxy
  # /grafana/ here. ufw/Security Group restricts the source IP to the
  # public server only — see infra/scripts/firewall-private.sh.
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  storage1:
  storage2:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:

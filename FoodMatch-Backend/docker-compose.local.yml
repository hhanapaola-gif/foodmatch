name: foodmatch-local-dev

# Local development database, dedicated to this project only.
# Not used in production — infra/server-private has the real deploy compose.
# Run with: docker compose -f docker-compose.local.yml up -d
services:
  mysql:
    image: mysql:latest
    container_name: foodmatch-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-foodmatch_local}
      MYSQL_DATABASE: ${DB_DATABASE:-foodmatch_dev}
    ports:
      - "3308:3306"
    volumes:
      - foodmatch_mysql_data:/var/lib/mysql

volumes:
  foodmatch_mysql_data:
    name: foodmatch_mysql_data

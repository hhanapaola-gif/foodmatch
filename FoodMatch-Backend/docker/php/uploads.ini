; PHP defaults (upload_max_filesize=2M, post_max_size=8M) are too small for
; real photos (logos, plan/branch images) taken with a phone camera — a
; single upload over 2M silently fails validation, and the whole request
; body over 8M gets its $_POST/$_FILES wiped by PHP before Laravel ever
; sees it, surfacing to the browser as a bare connection failure instead of
; a normal validation error. Matches nginx's client_max_body_size (64M).
upload_max_filesize = 20M
post_max_size = 20M

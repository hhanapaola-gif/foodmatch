global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # This box's own metrics.
  - job_name: "node-exporter-monitoring"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          server: "monitoring"

  # PRIVATE_SERVER_IP / PUBLIC_SERVER_IP below are placeholders — replace
  # with the real private IPs before starting, see infra/DEPLOYMENT.md
  # ("sed -i" step). These exporters are only reachable because
  # firewall-private.sh / firewall-public.sh allow this monitoring server's
  # private IP through on these ports.
  - job_name: "node-exporter-private"
    static_configs:
      - targets: ["PRIVATE_SERVER_IP:9100"]
        labels:
          server: "private"

  - job_name: "mysqld-exporter"
    static_configs:
      - targets: ["PRIVATE_SERVER_IP:9104"]

  - job_name: "node-exporter-public"
    static_configs:
      - targets: ["PUBLIC_SERVER_IP:9100"]
        labels:
          server: "public"

  # Nginx LB and edge Nginx expose /nginx_status via stub_status; scraped
  # through a small nginx-prometheus-exporter if added later (see DEPLOYMENT.md).

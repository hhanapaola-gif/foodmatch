name: foodmatch-private

x-app-build: &app-build
  context: ../../FoodMatch-Backend
  dockerfile: Dockerfile
  target: app

x-web-build: &web-build
  context: ../../FoodMatch-Backend
  dockerfile: Dockerfile
  target: web

services:
  # ---- Laravel replica 1 (primary: runs migrations/cache warmup on boot) ----
  app1:
    build: *app-build
    env_file: ../../FoodMatch-Backend/.env
    environment:
      CONTAINER_ROLE: primary
    volumes:
      - storage1:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web1:
    build: *web-build
    environment:
      PHP_UPSTREAM: app1:9000
    depends_on:
      - app1
    restart: unless-stopped

  # ---- Laravel replica 2 ----
  app2:
    build: *app-build
    env_file: ../../FoodMatch-Backend/.env
    environment:
      CONTAINER_ROLE: replica
    volumes:
      - storage2:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web2:
    build: *web-build
    environment:
      PHP_UPSTREAM: app2:9000
    depends_on:
      - app2
    restart: unless-stopped

  # ---- Internal load balancer: what the public server's Nginx talks to ----
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-lb/lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"   # bind only to the private network interface in production, see DEPLOYMENT.md
    depends_on:
      - web1
      - web2
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-delivery_app_db}
      MYSQL_USER: ${DB_USERNAME:-foodmatch}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?set MYSQL_EXPORTER_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init-exporter-user.sh:/docker-entrypoint-initdb.d/init-exporter-user.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Exposed on the host so the monitoring server (separate box) can scrape
  # them over the private network — ufw/Security Group restricts source IP,
  # see infra/scripts/firewall-private.sh.
  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/log:/host/varlog:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile.directory=/host/varlog/node-exporter
    restart: unless-stopped

  mysqld-exporter:
    # Pinned: v0.15+ dropped DATA_SOURCE_NAME env var support in favor of a
    # --config.my-cnf file, which broke this service under :latest (confirmed
    # in pre-deploy validation). v0.14.0 is the last version reading DSN from env.
    image: prom/mysqld-exporter:v0.14.0
    ports:
      - "9104:9104"
    environment:
      DATA_SOURCE_NAME: "exporter:${MYSQL_EXPORTER_PASSWORD:?set MYSQL_EXPORTER_PASSWORD in .env}@(mysql:3306)/"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  storage1:
  storage2:
  mysql-data:
  redis-data:
